name: Runtime and examples
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,torch]'
      - name: Complete runtime tests and real DDP checkpoint regression
        run: python -m pytest tests -q
      - name: Real fail-stop replacement of both logical ranks
        run: |
          python examples/generic_ddp/fault_replacement.py --fail-rank 0
          python examples/generic_ddp/fault_replacement.py --fail-rank 1
      - name: Script syntax and publication hygiene
        run: |
          for script in *.sh examples/*/*.sh; do bash -n "$script"; done
          python tools/check_publication.py
