name: Runtime and examples
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,generic-ddp]'
      - name: Complete runtime tests and real DDP checkpoint regression
        run: python -m pytest tests -q --junitxml=ci-results/pytest.xml
      - name: Report test failures
        if: always()
        run: python tools/report_ci_results.py ci-results/pytest.xml
      - name: Real fail-stop replacement of both logical ranks
        run: |
          set -o pipefail
          mkdir -p ci-results
          python -u examples/generic_ddp/fault_replacement.py --fail-rank 0 2>&1 | tee ci-results/fault-rank0.log
          python -u examples/generic_ddp/fault_replacement.py --fail-rank 1 2>&1 | tee ci-results/fault-rank1.log
      - name: Script syntax and publication hygiene
        run: |
          for script in *.sh examples/*/*.sh; do bash -n "$script"; done
          python tools/check_publication.py
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-test-results-python-${{ matrix.python }}
          path: ci-results/
          if-no-files-found: ignore
