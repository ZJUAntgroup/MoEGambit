[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moegambit"
version = "0.1.0"
description = "Engine-neutral runtime for contract-based MoE training recovery"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "MoEGambit Authors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Distributed Computing",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
moegambit-launch = "moegambit.cli.launch:main"
moegambit-watch = "moegambit.cli.watch:main"
moegambit-adapters = "moegambit.cli.adapters:main"

[project.entry-points."moegambit.engine_adapters"]
megatron = "moegambit_megatron:MegatronAdapter"
deepspeed = "moegambit_deepspeed:DeepSpeedAdapter"

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "moegambit*",
  "moegambit_megatron*",
  "moegambit_deepspeed*",
  "elastic*",
]

[tool.setuptools.package-data]
elastic = ["*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
