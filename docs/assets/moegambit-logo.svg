<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title description">
  <title id="title">MoEGambit chess knight</title>
  <desc id="description">A white chess knight on a blue and green chessboard.</desc>
  <defs>
    <linearGradient id="background" x1="18" y1="12" x2="144" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.52" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="rim" x1="20" y1="18" x2="140" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bfdbfe"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <pattern id="board" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#ffffff" opacity="0.07"/>
      <rect x="18" y="18" width="18" height="18" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="150" height="150" rx="34" fill="url(#background)"/>
  <rect x="5" y="5" width="150" height="150" rx="34" fill="url(#board)"/>
  <rect x="8" y="8" width="144" height="144" rx="31" fill="none" stroke="url(#rim)" stroke-width="3" opacity="0.9"/>

  <g filter="url(#shadow)">
    <path
      d="M43 119c1-12 5-22 12-31 5-6 12-12 20-19l-11 1-15-12 29-30 7 17c17-1 30 7 36 21l-17 9c-3-7-8-11-15-12-5 7-4 14 1 22l8 12c5 7 7 14 5 22H43Z"
      fill="#f8fafc"
      stroke="#dbeafe"
      stroke-width="2.5"
      stroke-linejoin="round"/>
    <path
      d="M53 117h47l8 10H45l8-10Z"
      fill="#f8fafc"
      stroke="#dbeafe"
      stroke-width="2.5"
      stroke-linejoin="round"/>
    <rect x="39" y="127" width="74" height="10" rx="5" fill="#f8fafc" stroke="#dbeafe" stroke-width="2.5"/>
    <circle cx="91" cy="54" r="3.6" fill="#172554"/>
    <path d="M105 67c4 0 8 1 11 3" fill="none" stroke="#172554" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>
